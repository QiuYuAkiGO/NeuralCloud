<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misty 生产回复评审 · 第1轮</title>
<style>body{max-width:900px;margin:30px auto;padding:0 22px;font:16px/1.7 system-ui;color:#263538;background:#f5f4f0}h1{font-size:25px}button{padding:10px 16px;margin:4px;border:1px solid #aab5b3;border-radius:6px;background:white;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#245c4a;color:white}button:disabled{opacity:.4}.context{background:#e9eeea;padding:16px}.message{white-space:pre-wrap;margin:12px 0}.message small{display:block;color:#596963}.reply{background:white;padding:22px;white-space:pre-wrap}header,.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.hint{color:#596963;font-size:14px}img{max-width:100%;max-height:300px}</style>
<h1>Misty 生产回复评审 · 第1轮</h1><p>20 条历史真实回复，每条点一次即可。所有回复都有成功发送回执；本轮不是 A/C 对照，也未生成新回复。</p><p id="rule"></p><p class="hint">只评当前这条 Misty 回复。上下文为近期节选；若缺少图片、引用或背景影响判断，请选“无法判断”。每轮最多 30 条，不需要写评语。</p>
<header><span id="progress"></span><button id="export">导出本轮评分</button></header><main id="app"></main><div class="nav"><button id="prev">上一条</button><button id="pending">跳到未评</button><button id="next">下一条</button></div><p id="notice" class="hint">选择保存在当前浏览器；完成后请导出评分。</p>
<script>
const data=/*DATA*/{};const key='misty-production-review:'+data.round_id+':'+data.source_sha256;let scores={};let index=0;try{scores=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
const labels=[['like','喜欢，值得保留'],['neutral','一般，可以接受'],['improve','需要改进'],['unevaluable','无法判断']];document.querySelector('#rule').textContent=data.rating_rule;
function show(){const row=data.rows[index],app=document.querySelector('#app');app.replaceChildren();const h=document.createElement('h2');h.textContent='第 '+(index+1)+' / '+data.rows.length+' 条';app.append(h);const context=document.createElement('section');context.className='context';for(const m of row.context){const box=document.createElement('div');box.className='message';const label=document.createElement('small');label.textContent=m.speaker;box.append(label,document.createTextNode(m.text||'[图片消息，当前节选无可用图片]'));for(const src of m.images||[]){const img=document.createElement('img');img.src=src;img.alt='历史消息附件';box.append(img)}context.append(box)}app.append(context);const title=document.createElement('h3');title.textContent='待评的 Misty 回复';const reply=document.createElement('section');reply.className='reply';reply.textContent=row.reply;app.append(title,reply);for(const [value,label]of labels){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(scores[row.id]===value));b.onclick=()=>{scores[row.id]=scores[row.id]===value?null:value;try{localStorage.setItem(key,JSON.stringify(scores))}catch{document.querySelector('#notice').textContent='保存失败，请导出备份。'}show()};app.append(b)}document.querySelector('#progress').textContent='已评 '+data.rows.filter(r=>scores[r.id]).length+' / '+data.rows.length;document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===data.rows.length-1;}
document.querySelector('#prev').onclick=()=>{index--;show();window.scrollTo(0,0)};document.querySelector('#next').onclick=()=>{index++;show();window.scrollTo(0,0)};document.querySelector('#pending').onclick=()=>{const i=data.rows.findIndex(r=>!scores[r.id]);if(i>=0){index=i;show();window.scrollTo(0,0)}else{document.querySelector('#notice').textContent='本轮全部完成，可以导出评分了。'}};
document.querySelector('#export').onclick=()=>{const output={version:1,mode:'production_single_reply',round_id:data.round_id,source_sha256:data.source_sha256,rating_rule:data.rating_rule,scores:data.rows.map(r=>({message_id:r.id,rating:scores[r.id]||null}))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));a.download='misty-production-review-r1.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};index=Math.max(0,data.rows.findIndex(r=>!scores[r.id]));show();
</script></html>
