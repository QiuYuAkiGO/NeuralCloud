<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misty 口语对照盲评</title>
<style>body{font:16px/1.65 system-ui;max-width:1060px;margin:24px auto;padding:0 20px;color:#263538;background:#f5f4f0}h1{font-size:24px}button,select{font:inherit;padding:9px 16px;border:1px solid #aab5b3;border-radius:6px;background:white;cursor:pointer}button:hover{background:#e7eeeb}button[aria-pressed=true]{background:#245c4a;color:white;border-color:#245c4a}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.context{background:#e9eeea;padding:16px 20px;margin:20px 0}.chat{white-space:pre-wrap;margin:12px 0}.chat small{display:block;color:#556762}.chat img{display:block;max-width:min(100%,360px);max-height:360px;margin:10px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.reply{background:white;padding:18px;display:flex;flex-direction:column;align-items:start}.reply p{white-space:pre-wrap;overflow-wrap:anywhere;flex:1}.reply.selected{outline:2px solid #245c4a}.other{display:flex;gap:10px;justify-content:center;margin:12px}.round{border-bottom:1px solid #ccd2ce;padding:12px 0}small,.hint{color:#596963}.nav{display:flex;justify-content:space-between;margin:20px 0}button:disabled{opacity:.4;cursor:default}#notice{font-size:14px;color:#596963}</style>
<h1>Misty 口语表达盲评</h1><p>读完用户的话，点击你更喜欢的回复。每个案例有三次对照，不需要打分或写评语。</p>
<header><select id="filter" aria-label="案例范围"><option value="12">先看12对</option><option value="all">全部配对</option></select><button id="export">导出选择</button><span id="progress"></span></header><p id="notice">选择保存在当前浏览器；离开前也可以导出备份。</p><main id="app"></main><div class="nav"><button id="prev">上一个案例</button><button id="next">下一个案例</button></div>
<script>
const pairs=/*DATA*/[];
const storageKey='misty-blind-click-v2:'+pairs.map(p=>p.pair_id).join(',');let scores={};let index=0;
try{scores=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
const app=document.querySelector('#app');const filter=document.querySelector('#filter');
function list(){return filter.value==='12'?pairs.slice(0,12):pairs}
function aggregate(v){if(v.length!==3||v.some(x=>!x))return null;if(v.includes('unevaluable'))return 'unevaluable';const l=v.filter(x=>x==='left').length,r=v.filter(x=>x==='right').length;return l===r?'tie':l>r?'left':'right'}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(scores))}catch{document.querySelector('#notice').textContent='浏览器无法保存选择，请点击“导出选择”备份。'}}
function choose(id,i,value){scores[id]??={pair_id:id,trial_preferences:[null,null,null],preference:null};const s=scores[id];s.trial_preferences[i]=s.trial_preferences[i]===value?null:value;s.preference=aggregate(s.trial_preferences);save();show()}
function button(text,selected,action){const b=document.createElement('button');b.textContent=text;b.setAttribute('aria-pressed',String(selected));b.onclick=action;return b}
function show(){app.replaceChildren();const items=list();index=Math.max(0,Math.min(index,items.length-1));const p=items[index];if(!p)return;const s=scores[p.pair_id];const title=document.createElement('h2');title.textContent='案例 '+(index+1)+' / '+items.length;app.append(title);const context=document.createElement('section');context.className='context';const label=document.createElement('strong');label.textContent='用户说了什么';context.append(label);for(const m of p.context){const box=document.createElement('div');box.className='chat';const name=document.createElement('small');name.textContent=m.speaker;box.append(name,document.createTextNode(m.text||'[图片消息]'));for(const src of m.images){const image=document.createElement('img');image.src=src;image.alt='用户发送的图片';box.append(image)}context.append(box)}app.append(context);
for(let i=0;i<p.trials.length;i++){const round=document.createElement('section');round.className='round';const h=document.createElement('h3');h.textContent='第 '+(i+1)+' 次对照';round.append(h);const line=document.createElement('div');line.className='pair';for(const side of ['left','right']){const v=p.trials[i][side],selected=s?.trial_preferences[i]===side;const box=document.createElement('div');box.className='reply'+(selected?' selected':'');const label=document.createElement('small');label.textContent=side==='left'?'回复一':'回复二';const text=document.createElement('p');text.textContent=v.messages.join('\n\n')||(v.wait?'[选择不接话]':v.status==='unevaluable'?'[缺少必要证据，无法评价]':'[没有发出回复]');box.append(label,text);if(v.status!=='completed'){const note=document.createElement('small');note.textContent='本次未正常完成，建议选择“无法判断”。';box.append(note)}box.append(button(selected?'已选择这条回复':'更喜欢这条回复',selected,()=>choose(p.pair_id,i,side)));line.append(box)}round.append(line);const other=document.createElement('div');other.className='other';for(const [value,label]of [['tie','两条差不多'],['unevaluable','无法判断']])other.append(button(label,s?.trial_preferences[i]===value,()=>choose(p.pair_id,i,value)));round.append(other);app.append(round)}document.querySelector('#progress').textContent='已完成 '+items.filter(p=>scores[p.pair_id]?.preference).length+' / '+items.length+' 个案例';document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===items.length-1;}
filter.onchange=()=>{index=0;show()};document.querySelector('#prev').onclick=()=>{index--;show();window.scrollTo(0,0)};document.querySelector('#next').onclick=()=>{index++;show();window.scrollTo(0,0)};
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,mode:'preference_only',scores:Object.values(scores)},null,2)],{type:'application/json'}));a.download='misty-human-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};show();
</script></html>
