[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralcloud-memory"
version = "1.0.0a1"
description = "Independent resident online memory for Misty"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
retrieval = ["numpy>=2,<3", "torch>=2.14,<2.15", "sentence-transformers>=5,<6", "onnxruntime>=1.23,<2", "optimum[onnxruntime]>=2,<3"]
archive = ["cryptography>=44,<47"]
dev = ["pytest>=8.3,<9", "httpx>=0.28,<1", "ruff>=0.9,<1", "psutil>=6,<8", "numpy>=2,<3"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
neuralcloud-memory = "neuralcloud.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuralcloud*"]

[tool.pytest.ini_options]
testpaths = ["tests/resident"]
pythonpath = ["src"]
addopts = "--confcutdir=tests/resident -ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.setuptools.package-data]
neuralcloud = ["workflows/*.json"]
