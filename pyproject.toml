[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralcloud-harness"
version = "0.1.0"
description = "NeuralCloud character cognitive harness — memory subsystem + online inference pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "numpy>=1.26",
    "tzdata>=2024.1",
    "psutil>=6.0",
]

[project.optional-dependencies]
qq = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "Pillow>=10.4",
    "websockets>=15",
    "qrcode>=8.2",
    "tokenizers>=0.23.2",
]
postgres = [
    "psycopg2-binary>=2.9",
]
gui = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
]
eval = [
    "torch>=2.2",
    "transformers>=4.41",
]
dev = [
    "Pillow>=10.4",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
include = ["harness*", "infra*", "gui*"]

[tool.setuptools.package-data]
gui = ["static/*"]
"harness.llm" = ["data/*.json", "data/*.md", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
pythonpath = ["."]
markers = [
    "integration: requires PostgreSQL + pgvector",
    "soak: requires a live physiology-enabled MistyAI service",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
