<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuralCloud · 路径自检</title>
  <link rel="stylesheet" href="/static/ops.css" />
  <link rel="stylesheet" href="/static/selfcheck.css" />
</head>
<body>
  <header class="ops-topbar">
    <a class="ops-brand" href="/" aria-label="返回 NeuralCloud 对话页">
      <span class="ops-mark">NC</span>
      <span><strong>路径自检</strong><small>被动健康投影，不发送 QQ</small></span>
    </a>
    <div class="ops-meta">
      <span id="enabled-chip" class="status-chip muted">自检 …</span>
      <button type="button" id="refresh" class="button secondary">刷新</button>
      <button type="button" id="run" class="button">立即扫描</button>
      <a class="button secondary" href="/ops">运维</a>
      <a class="button secondary" href="/">返回对话</a>
    </div>
  </header>
  <p id="banner" class="availability" hidden role="status"></p>
  <main class="ops-main report-main">
    <section class="section-heading">
      <div>
        <h1>最近一次被动自检</h1>
        <p id="caption">Runtime 心跳会定期扫描通道与 journal 证据，不会主动写日记或建 Goal。</p>
      </div>
      <span id="generated" class="status-chip muted">尚未运行</span>
    </section>
    <div id="paths" class="path-grid"></div>
    <section class="panel">
      <header><h2>历史文件</h2></header>
      <ul id="history" class="compact-list"></ul>
    </section>
    <details class="panel raw-panel">
      <summary>原始 JSON</summary>
      <pre id="raw-json" class="raw-json">尚未加载</pre>
    </details>
  </main>
  <script src="/static/selfcheck.js"></script>
</body>
</html>
