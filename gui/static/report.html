<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuralCloud · 每日运行报告</title>
  <link rel="stylesheet" href="/static/ops.css" />
  <link rel="stylesheet" href="/static/report.css" />
</head>
<body>
  <header class="ops-topbar">
    <a class="ops-brand" href="/" aria-label="返回 NeuralCloud 对话页">
      <span class="ops-mark">NC</span>
      <span><strong>Misty 日报</strong><small>情绪、经历与运行记录</small></span>
    </a>
    <div class="ops-meta">
      <label class="window-field">日期
        <input id="day" type="date" />
      </label>
      <button type="button" id="refresh" class="button secondary">刷新</button>
      <button type="button" id="finalize" class="button secondary">归档该日</button>
      <a class="button secondary" href="/selfcheck">自检</a>
      <a class="button secondary" href="/ops">运维</a>
      <a class="button secondary" href="/">返回对话</a>
    </div>
  </header>
  <p id="banner" class="availability" hidden role="status"></p>
  <main class="ops-main report-main">
    <section class="section-heading">
      <div>
        <h1 id="title">Misty 的一天</h1>
        <p id="caption">查看情绪起伏、内稳态变化与当天的记忆。</p>
      </div>
      <span id="finalized" class="status-chip muted">未归档</span>
    </section>
    <div id="day-chips" class="day-chips" hidden></div>
    <div id="summary" class="metric-grid"></div>
    <div id="dashboard" class="report-dashboard"></div>
    <section class="panel">
      <header><h2>日记</h2></header>
      <p id="diary-status">正在读取日记状态…</p>
      <div class="actions">
        <button type="button" id="diary-invite" class="button secondary">邀请写日记</button>
        <button type="button" id="diary-pause" class="button secondary">暂停</button>
      </div>
    </section>
    <details class="panel raw-panel">
      <summary>原始 JSON</summary>
      <pre id="raw-json" class="raw-json">尚未加载</pre>
    </details>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/report-insights.js"></script>
  <script src="/static/report.js"></script>
</body>
</html>
