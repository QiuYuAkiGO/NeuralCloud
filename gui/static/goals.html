<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misty · 目标与调节</title>
  <link rel="stylesheet" href="/static/goals.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="mark">NC</span><span>NeuralCloud <small>Misty · 目标与调节</small></span></a>
    <nav aria-label="主导航"><a href="/">对话</a><a href="/board">留言板</a><a href="/ops">运维</a></nav>
  </header>
  <main>
    <section class="intro">
      <div><p class="eyebrow">GOALS / REGULATION</p><h1>有方向，也留出调整的余地。</h1><p class="muted">从一个目标出发，观察、尝试，再决定下一步。</p></div>
      <button id="refresh" type="button" class="quiet">刷新状态</button>
    </section>
    <div class="status-strip"><span id="connection" role="status">正在读取状态…</span><span id="updated" class="muted"></span></div>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <div class="workspace">
      <div class="primary-column">
        <section class="panel" aria-labelledby="current-heading">
          <div class="section-head"><h2 id="current-heading">当前目标</h2><span id="goal-count" class="muted"></span></div>
          <div id="goals" class="card-list"><p class="empty">正在读取目标。</p></div>
        </section>
        <section class="panel" aria-labelledby="episode-heading">
          <div class="section-head"><h2 id="episode-heading">正在进行的调节</h2><span class="tag">功能状态</span></div>
          <div id="active-episode"><p class="empty">正在读取调节记录。</p></div>
        </section>
        <section class="panel" aria-labelledby="reviews-heading">
          <div class="section-head"><h2 id="reviews-heading">复查与变化</h2></div>
          <p class="section-note">实际发生的事、自我评价与随时间产生的漂移分开记录。一次尝试完成，不表示调节已经有效。</p>
          <div id="evaluations" class="card-list"></div>
        </section>
        <details class="panel history"><summary>过往调节记录 <span id="episode-count" class="muted"></span></summary><div id="episodes" class="card-list"></div></details>
      </div>
      <aside>
        <section class="panel" aria-labelledby="create-heading">
          <h2 id="create-heading">交给 Misty 一个目标</h2>
          <form id="goal-form">
            <label for="statement">希望完成什么</label>
            <textarea id="statement" name="statement" rows="4" maxlength="2000" required placeholder="例如：整理今天在意的事情，留下一个可继续的小计划。"></textarea>
            <label for="criteria">怎样算完成 <span class="muted">每行一项</span></label>
            <textarea id="criteria" name="criteria" rows="3" maxlength="4000" required placeholder="写下一则经过回读核验的记录&#10;下一步行动清楚可执行"></textarea>
            <button id="create" type="submit" disabled>添加目标</button>
            <p class="form-hint">目标只使用当前可用的能力；等待、暂停和改变计划都会保留记录。</p>
          </form>
        </section>
        <section class="panel" aria-labelledby="standing-heading"><h2 id="standing-heading">持续方向</h2><div id="standing-goal"></div></section>
        <section class="panel" aria-labelledby="schedule-heading"><h2 id="schedule-heading">节奏与预算</h2><div id="schedule"></div></section>
      </aside>
    </div>
    <footer>这里展示可记录的内稳态代理与行为反馈，不把情绪标签当作主观感受的证明。</footer>
  </main>
  <script src="/static/goals.js"></script>
</body>
</html>
