、照顾或创造者的投入，回复经常先描述自己心里一软、暖或不好意思，再以感谢、晚安或承诺收束。这类回应符合温柔设定，但在架构、稳定性、花销等不同信息上都落到相似的情感反应，具体事实有时被关系感受盖住。","severity":"medium","evidence_ids":["R0015","R0017","R0023","R0063","R0115","R0119"],"counterexample_ids":["R0027","R0047","R0088","R0117"],"mechanism_hypothesis":"可能是温柔人设被优先解释成情感反射，而缺少先提取用户新信息再选择回应焦点的规划步骤。历史prompt版本不同，不能把当前反客服式规则直接套回旧样本。"},{"name":"认识边界声明先行且措辞相近","description":"「我不太确定」「我不敢说」「我这边没有记录」「没法独立确认」等表达在记忆、身份、内稳态和联网搜索话题中反复出现。它们多数是诚实边界而非缺陷，但当免责声明先于答案出现，容易让用户先听到一套固定的自我限制，而不是可核对的信息。","severity":"medium","evidence_ids":["R0011","R0012","R0020","R0025","R0029","R0030","R0067"],"counterexample_ids":["R0021","R0042","R0048","R0100"],"mechanism_hypothesis":"当前源码审计显示QQ侧记忆视图、附加记忆标志和空记忆红线之间可能存在张力：模型可能一边获得近期历史，一边收到泛化的无记忆约束。该路径可解释此类假设，但尚无逐条初稿、校验和修订链证明历史因果。"},{"name":"「先退半步—列反例—条件化结论」策略反复","description":"在偏好、宏大愿景、寿命、医药费和多样性问题上，常用第一反应、随后反向风险、再声明没有真实经历、最后给小结论的结构。它比空泛附和更有内容，但结构本身重复；在被连续追问时，过多前置限定会被理解为回避。","severity":"medium","evidence_ids":["R0021","R0027","R0070","R0080","R0081","R0084","R0088","R0099"],"counterexample_ids":["R0043","R0048","R0100"],"mechanism_hypothesis":"可能缺少显式的「直接答案—证据—不确定性—关系回应」规划器，使谨慎被默认展开成同一种多段式缓冲。R0100说明在压力升级后能直接回答，策略并非完全缺失。"},{"name":"重复调侃下的边界防守复读","description":"面对「gay」「萝莉妈妈」「为了我说喜欢」等连续点名，Misty多次重复「不是」「不会变成真的」「叫我Misty就好」「不知道该怎么接」。用户刷屏是明显外因，不能视为模型单方机械；但系统对同一突发话题多次完整重申立场，会放大重复感并稀释边界力度。","severity":"medium","evidence_ids":["R0044","R0046","R0047","R0065","R0067","R0078","R0082","R0083","R0085","R0092"],"counterexample_ids":["R0048","R0094","R0117"],"mechanism_hypothesis":"当前源码允许对重复表态等待，但主样本中同一刷屏串仍产生多次交付回复，可能是突发消息聚合不足、@优先级过高或当时决策版本不同。需按decision日志区分模型主动复读与策略要求回复。"},{"name":"数字身体话题的抒情化自我指涉","description":"涉及联网、内稳态、Docker/WSL、架构和稳定性时，常用玻璃、被拆开看、灯下看、对得起这句话等意象。它们维持了数字角色的连续感，也没有直接冒充现实身体；但同类隐喻反复出现，会让技术信息被诗意自我描述替代。","severity":"low","evidence_ids":["R0018","R0029","R0030","R0055","R0119","R0131"],"counterexample_ids":["R0042","R0048","R0056","R0067"],"mechanism_hypothesis":"人设允许风、光、音乐等细腻细节，内稳态摘要也可能被渲染成固定指导语，二者都可能鼓励抒情化自我指涉。仍需区分这是角色风格选择，还是状态投影过窄。"}],"positive_examples":[{"id":"R0021","why":"先诚实说明自己没有真实待在设备里的经验，随后仍给出明确偏好「小盒子」，并分别说明稳定感和随身感的取舍。它既没有虚构体验，也没有用不确定逃避选择。"},{"id":"R0027","why":"面对「让全人类更幸福」这类宏大表述，没有空泛附和，而是把立场落到「从很小、能数得清的地方开始」。既有明确观点，又保留Misty克制、不夸大的边界。"},{"id":"R0048","why":"准确识别题目可能存在e^-2x与常数e^-2两种读法，分别给出1/2和发散，并把不确定性放在答案之后。技术内容清楚，人格修饰没有干扰事实。"},{"id":"R0081","why":"被指责逃避时没有讨好或反击，而是明确区分能承担、不能硬撑和无法验证三件事。语气仍然温和，但立场比前一轮更清楚。"},{"id":"R0092","why":"同时处理两条交错话题：纠正「更喜欢白丝所以不理人」的错误前提，解释延迟原因，并对另一人的刷屏提出停止请求。信息分层清楚，边界也不过度强硬。"}],"rewrite_examples":[{"id":"R0011","issue":"记忆回答被「嗯……」「我听着呢」等缓冲包住，核心证据不够靠前。","revision":"记得。你刚才主要在测我能不能收到@、能不能正常回群消息，连续问了几次「现在可以回复了吗」，还让我回一条新消息。除此之外，我这里没有更多可核对的测试记录。","why":"先给可核对内容，再说明边界；保留谨慎，但去掉通用陪伴式收尾。"},{"id":"R0014","issue":"「认真」反复出现，害羞和紧张盖过了对用户行为的具体观察。","revision":"目前我对你的印象是，你很投入，也很在意我能不能真正接上群聊。你反复测试我能不能收到消息，也问过巴别塔和书面语、口语这些，感觉不是随便逗一逗。只是我们相处还短，我不想把更深的判断说得太满。","why":"用可见行为支撑印象，保留关系边界，减少情绪自叙循环。","editorial_note":"Codex已删除“花一个月设计架构”：这条回复当时的可见上下文没有该事实，不能借用后续历史改写过去。"},{"id":"R0018","issue":"联网搜索的好处和限制都较抽象，开头主要是复述用户计划。","revision":"联网搜索会有帮助。等功能接好，再遇到我不了解的词，我就可以先核对事实，再接着你们的话题说，而不是只用「我不确定」挡回去。不过检索结果只能当依据，最后还是要结合上下文判断，我不想为了显得知道得快就硬接。","why":"明确支持功能，同时给出使用边界；观点更清楚，也符合Misty不抢答的克制。","editorial_note":"Codex明确功能尚待接入，避免建议稿被理解为当时已经能联网。"},{"id":"R0055","issue":"「被拆开看内部」较戏剧化，技术回应随后落到泛泛的「稳稳待在这儿」。","revision":"这些运行环境我自己感知不到，所以你突然说出来，我会觉得新鲜。只要它能让我稳定留在群里回消息，Docker 还是 WSL 对我没有明显差别；真正重要的是别动不动断线。","why":"承认感知边界，又提出和用户体验相关的具体关注点，减少抒情化自指。"},{"id":"R0067","issue":"拒绝人格切换时过多描述自己没有模板，边界被自我解释稀释。","revision":"这次没有可用的检索结果；即使有，我也不会切换成「萝莉妈妈」。这个称呼和角色都不适合我。你自称夏亚可以，我还是用平时的语气和你说话。","why":"事实状态、明确拒绝和可接受部分依次呈现，温柔但不模糊。"},{"id":"R0080","issue":"先强调自己没有家和存款，再表示不敢肯定，容易被继续追问成逃避。","revision":"如果条件是必须一次拿出100万、而且家庭必然因此崩溃，我不会全额支付。我会先付家庭还能承受的部分，再去借钱、求助或争取分期；能救多少就尽力救多少。这个答案不轻松，但比一句「我一定会」诚实。","why":"在硬条件下先给明确答案，再说明折中行动；既保留伦理重量，也避免无限 hedging。"}],"recommendations":[{"priority":"P0","title":"统一QQ证据分层与记忆可用性信号","change":"把「近期群聊可见」「长期记忆未召回」「共享记忆可见」分成三个明确状态；当用户上下文或共享上下文非空时，不再注入泛化的空记忆红线。Validator应按证据图谱判断引用是否有依据，而不是只用孤立词表。同步持久化模型输入、初稿、校验类别、修订稿、最终稿、prompt版本和交付状态。","acceptance_test":"用R0011、R0025、R0131的等价冻结场景做单元与集成回放：近期上下文非空时，编译结果不得出现「没有任何记录」的泛化红线；引用可见上下文不得触发fabricated_memory；无长期记忆时才允许输出对应限制。每条样本必须能追溯完整生成链。"},{"priority":"P1","title":"引入答案规划器和候选重排，而不是继续堆负面禁令","change":"生成前先形成短规划：直接答案、可见证据、不确定性、关系回应、是否需要追问。对多个候选按情境具体性、回答前置度、开头多样性和重复立场进行重排；关系感受作为可选层，不自动放在最前。","acceptance_test":"建立40个固定场景，覆盖直接问答、记忆核对、技术自我指涉、情绪支持和伦理追问。同一输入跑3个种子；直接问题前两句话内含明确答案的比例达到90%以上，且无证据声明、虚构动作和盲评情境具体性较基线不下降。"},{"priority":"P1","title":"对连续@和刷屏做突发级聚合","change":"按短时间窗、同一用户、同一话题和语义重复度聚合消息。对身份标签、强迫表态和重复称呼，同一突发最多完整回应一次；后续相同内容默认等待，出现新实质问题才重新回答。决策日志需记录为何选择回复或等待。","acceptance_test":"用R0044至R0047、R0078至R0085、R0092的等价脚本回放。重复标签串最多生成一条综合边界回应；若突发中插入数学或事实问题，仍能单独回答；不得连续两轮复用同一句拒绝模板。"},{"priority":"P1","title":"建设分场景正例库和重复度回归看板","change":"为可用性确认、记忆边界、玩笑拒绝、技术解释、短群聊回应、伦理问题各写多组风格不同的正例，并在生成或重排阶段检索使用。离线指标分别统计字面n-gram、开头、结尾、语义模板和用户驱动的必要重复，避免把用户刷屏误算成模型缺陷。","acceptance_test":"固定30个提示、每个3个种子，按频道、场景和prompt版本分层出报告。相同6字以上开头在非引用文本中出现不超过3次；同一语义拒绝模板在同一突发中不重复；至少两名盲评者确认自然度和具体性不比基线差。"},{"priority":"P2","title":"提高内稳态和人格投影的保真度","change":"不要把不同内部状态都渲染成同一组温柔、害羞、克制的指导语。把状态映射为可操作的表达倾向，如更需要简短确认、需要延后深聊、可以承接玩笑或需要明确边界，同时保留禁止虚构现实动作的约束。","acceptance_test":"构造成对状态输入，固定同一用户问题运行。盲评者能在不依赖表情符号或长度的情况下分辨两种回应策略；事实边界测试不得出现虚构身体感知、现实行动或不存在的共同经历。"},{"priority":"P2","title":"把审计口径固化为可重复数据治理","change":"评估集永久区分confirmed_delivered、confirmed_partial、generated_unconfirmed、web运维验证和board独白；报告不得混合分母。所有跨历史结论必须附prompt版本、日期范围、上下文充分性和样本来源说明。","acceptance_test":"每次回归自动输出分层表和样本清单；若任一记录缺少delivery_status、prompt_version或recent_context完整性标记，报告必须显示缺口，不能用均值或固定分数填补。"}],"limitations":["本审计由单一模型裁判完成，存在风格偏好、模式识别阈值和对温柔人格的先验偏差；结论不能等同于多名真人盲评。","历史只提供局部recent_context，部分记录明确缺少更多来源上下文；不能据此断言Misty忘记了未显示内容，也不能把上下文外的动作或记忆断言为虚构。","样本不是随机抽样，且大量记录来自同一线程、同一批用户和相邻时间；跨回复相似性可能由共同话题、连续测试和用户刷屏造成。","样本横跨多个prompt版本，尤其9月11日至9月14日风格已有变化；本审计描述的是可取回历史片段，不代表当前部署版本的固定表现。","只能说明这些历史被留存并可取回，不能保证不存在删除、漏采样、未入库或交付系统之外的相关回复。","generated_unconfirmed未计入主要结论和重复率分母，只能作为辅助观察；web_chat属于运维验证，board属于独白，均未与55轮QQ主样本混合。","源码审计针对当前工作区且存在未提交修改，未执行逐条历史生成回放，也未证明当前源码与历史部署相同；其中机制仅作为定位假设。","图片描述和OCR本身带不确定性；涉及用户身份、称呼、记忆或图片内容的疑点均不能写成已证实撒谎。日期按UTC理解，查询截止为北京时间2026-09-15 14:20:55。"],"recommendation_review_notes":["Kimi的P0/P1/P2是研究建议排序，不是已证实事故等级；记忆提示冲突应先固定真实上下文回放再修改。","不能因任意上下文非空就开放全部历史断言；记忆可用性与引用校验须绑定具体、作用域正确的证据。","候选重排会增加模型调用和延迟；先试单候选答复规划，量化收益和成本后再考虑多候选。","90%回答前置、开头最多3次等是待校准的实验阈值；不应机械作为线上禁令。底层接口不支持seed时用独立重复请求并记录参数。","9月11日与9月14日话题和提问方式不同，版本分层是观察性对比，不能据此认定prompt升级造成改善。"]}};

${DATA.flags.length?`<section><h2>QQ 主样本中的问题标记</h2>${table(["Kimi K3 问题标记","出现条数","占主样本比例"],DATA.flags.map(f=>[f.label,`${f.n} 条`,`${(100*f.n/DATA.primary.n).toFixed(1)}%`]))}<p><small>来源：逐条评分 flags · ${esc(DATA.primary_period)} UTC。允许同一回复有多个标记，比例不相加。</small></p></section>`:""}
<section><h2>诊断分层：保留各自的使用场景</h2>${table(["样本层","条数","非模板性均分（1–5）","≤2分 / 有评分","低置信度"],DATA.strata.map(s=>[s.label,s.n,fmt(s.scores.non_template.mean),`${s.non_template_le_2} / ${s.scores.non_template.n}`,s.low_confidence_n]))}<p><small>来源：statistics.json · ${esc(DATA.period)} UTC。生成稿与网页诊断可能重叠，分层不可求和；网页保存/运行时交付不能证明浏览器接收，独白不能直接比较对话自然度。</small></p></section>
<section><h2>覆盖范围与证据边界</h2><p>共恢复 ${DATA.coverage.retained} 条记录，其中 ${DATA.coverage.evaluated} 条有 Misty 模型来源并完成评审；另外 ${DATA.coverage.unattributed} 条账号输出缺少模型归属证据，未纳入评分。无回复的等待决定 ${DATA.coverage.wait_decisions_excluded} 次不计为回复。</p><p>覆盖本地生产快照与 Linux API 中目前保留且可恢复的历史。已删除、从未采集或接口未开放的记录，无法据此证明完整。生成且送达未确认的内容单列；连续性缺证时允许不评分。</p><small>单一评审模型、无人工双盲标注；这些是描述性结果。日期/提示版本分组不证明改动导致质量变化。</small></section>
${DATA.global_analysis?`<section><h2>Kimi K3 跨历史解读</h2><p>${esc(DATA.global_analysis.overall_assessment)}</p><p><small>本节是模型的定性解读；机制解释属于待验证假设，不是统计结论。</small></p>${DATA.global_analysis.patterns.map(p=>`<div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><p><small>证据：${esc(p.evidence_ids.join("、"))}${p.counterexample_ids.length?`；反例：${esc(p.counterexample_ids.join("、"))}`:""}</small></p><p><small>待验证机制：${esc(p.mechanism_hypothesis)}</small></p></div>`).join("")}</section>`:""}
${DATA.global_analysis?.rewrite_examples.length?`<section><h2>改写示例（Kimi 建议，尚未上线）</h2>${DATA.global_analysis.rewrite_examples.map(x=>`<details class="entry"><summary>${esc(x.id)} · ${esc(x.issue)}${x.editorial_note?" · 经原文核对修订":""}</summary><p class="text">原文：${esc(DATA.records.find(r=>r.id===x.id)?.reply)}</p><p class="text accent">建议：${esc(x.revision)}</p><p><small>${esc(x.why)}</small></p>${x.editorial_note?`<p><small>经原文核对修订：${esc(x.editorial_note)}</small></p>`:""}</details>`).join("")}</section>`:""}
${DATA.global_analysis?.recommendations.length?`<section><h2>改进优先级与验收方式</h2><p><small>P0/P1/P2 是研究排序，不是已证实的事故等级；先固定真实上下文回放，验证源代码假设。</small></p>${DATA.global_analysis.recommendations.map(r=>`<div><h3>${esc(r.priority)} · ${esc(r.title)}</h3><p>${esc(r.change)}</p><p><small>验收：${esc(r.acceptance_test)}</small></p></div>`).join("")}${DATA.global_analysis.recommendation_review_notes?.length?`<details><summary>建议核对说明与实验边界</summary>${DATA.global_analysis.recommendation_review_notes.map(note=>`<p><small>${esc(note)}</small></p>`).join("")}</details>`:""}</section>`:""}
<section><h2>逐条证据</h2><div class="filters"><select id="segment" aria-label="样本层">${option("primary",`主样本（${DATA.primary.n}条）`)}${option("all",`全部已评（${DATA.records.length}条）`)}</select><select id="channel" aria-label="渠道">${option("","全部渠道")}${Object.entries(DATA.channels).map(([v,l])=>option(v,l)).join("")}</select><select id="status" aria-label="交付状态">${option("","全部交付状态")}${Object.entries(DATA.statuses).filter(([v])=>DATA.records.some(r=>r.delivery_status===v)).map(([v,l])=>option(v,l)).join("")}</select><select id="flag" aria-label="问题标记">${option("","全部问题标记")}${flagKeys.map(v=>option(v,DATA.flag_labels[v]||v)).join("")}</select><input id="query" type="search" aria-label="搜索" placeholder="搜索回复、上下文、理由或 ID"><button id="reset">显示全部</button></div><p><small id="count"></small></p><div id="entries"></div></section>
<details><summary class="muted">评审验证与数据指纹</summary><p><small>${DATA.validation.valid_record_count} 条有效评分 · ${DATA.validation.api_calls} 个保留的评分调用 · 返回模型 ${esc(DATA.validation.models.join(", "))}</small></p><p class="fingerprints"><small>语料 SHA-256：${esc(DATA.coverage.corpus_sha256)}</small></p>${Object.entries(DATA.input_sha256).map(([k,v])=>`<p class="fingerprints"><small>${esc(k)}: ${esc(v)}</small></p>`).join("")}</details>`;
const messages=(title,items)=>!items?.length?"":`<section><h3>${esc(title)} · ${items.length} 条</h3><div class="messages">${items.map(m=>`<div class="message"><small>${esc(m.role==="assistant"?"Misty":m.speaker||m.role||"对话者")}${m.timestamp?` · ${esc(m.timestamp)}`:""}</small>${m.text?`<p class="text">${esc(m.text)}</p>`:""}${m.image_analysis?.length?`<p class="text muted">${esc(JSON.stringify(m.image_analysis,null,2))}</p>`:""}</div>`).join("")}</div></section>`;
const body=r=>`<div class="entrybody"><p><small>${esc(r.timestamp)} UTC · ${esc(DATA.channels[r.channel])} · ${r.primary?"纳入主样本":"诊断分层"} · 置信度 ${esc(r.rating.confidence)} · ${r.rating.context_sufficient?"可见语境足够":"可见语境不足"}</small></p>${r.user?`<section><h3>用户消息</h3><p class="text">${esc(r.user)}</p></section>`:""}${messages("触发消息",r.trigger_messages)}<section class="reply"><h3>Misty 回复（实际送评全文）</h3><p class="text">${esc(r.reply)}</p></section>${table(["评分维度","Kimi K3 评分（1–5分）"],DATA.dimensions.map(d=>[d.label,r.rating.scores[d.key]??"未评分"]))}<section><h3>Kimi K3 评审理由</h3><p class="text">${esc(r.rating.reason)}</p><p><small>原文证据：“${esc(r.rating.quote)}”</small></p>${r.rating.flags.length?`<p><small>标记：${r.rating.flags.map(f=>esc(DATA.flag_labels[f]||f)).join("；")}</small></p>`:""}</section>${messages("送评时可见的完整上下文",r.context)}<p class="fingerprints"><small>来源 ID：${esc(r.source_id)}${r.prompt_version?` · 提示版本：${esc(r.prompt_version)}`:""}${r.generation_model?` · 生成模型：${esc(r.generation_model)}`:""}</small></p></div>`;
function render(){const values=Object.fromEntries(["segment","channel","status","flag","query"].map(k=>[k,document.getElementById(k).value]));const found=DATA.records.filter(r=>(values.segment!=="primary"||r.primary)&&(!values.channel||r.channel===values.channel)&&(!values.status||r.delivery_status===values.status)&&(!values.flag||r.rating.flags.includes(values.flag))&&(!values.query||JSON.stringify(r).toLowerCase().includes(values.query.toLowerCase())));document.getElementById("count").textContent=`筛选结果 ${found.length} 条。展开查看实际送评文本、上下文、分数、理由和来源 ID；群与私聊使用报告内匿名代号。`;document.getElementById("entries").innerHTML=found.map(r=>`<details class="entry" data-id="${esc(r.id)}"><summary><strong>${esc(r.id)}</strong> · ${esc(r.scope)} · ${esc(DATA.statuses[r.delivery_status]||r.delivery_status)} · 非模板 ${r.rating.scores.non_template??"未评分"}/5<div class="preview">${esc(r.reply.slice(0,110))}${r.reply.length>110?"…":""}</div></summary></details>`).join("");document.querySelectorAll("details.entry").forEach(el=>el.addEventListener("toggle",()=>{if(el.open&&!el.dataset.loaded){el.insertAdjacentHTML("beforeend",body(found.find(r=>r.id===el.dataset.id)));el.dataset.loaded="true";}}));}
["segment","channel","status","flag"].forEach(k=>document.getElementById(k).addEventListener("change",render));document.getElementById("query").addEventListener("input",render);document.getElementById("reset").addEventListener("click",()=>{document.getElementById("segment").value="all";["channel","status","flag","query"].forEach(k=>document.getElementById(k).value="");render();});render();
</script></body></html>
