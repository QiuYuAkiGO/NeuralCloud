services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neuralcloud-postgres
    environment:
      POSTGRES_USER: neuralcloud
      POSTGRES_PASSWORD: neuralcloud
      POSTGRES_DB: neuralcloud
    ports:
      - "5432:5432"
    volumes:
      - neuralcloud-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuralcloud -d neuralcloud"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neuralcloud-pgdata:
