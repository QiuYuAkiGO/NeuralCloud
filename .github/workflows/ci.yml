name: resident-memory
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  resident:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --extra dev --extra archive
      - run: uv run --no-sync ruff check src/neuralcloud tests/resident
      - run: uv run --no-sync pytest -q
      - run: npm test
        working-directory: plugins/dsh-neuralcloud
      - run: uv build --wheel
