name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --extra dev --extra gui --extra qq
      - run: uv run --no-sync python -m ruff check harness tests gui eval infra tools/ci tools/release tools/selfcheck/probes_production.py
      - run: uv run --no-sync python -m pytest -q
  windows-launcher:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --locked --extra dev --extra gui --extra qq
      - run: uv run --no-sync python -m pytest -q tests/test_start_script.py tests/test_dev_launcher.py tests/test_standalone_release.py
  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ci/build_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-candidate
          path: dist/*
          retention-days: 7
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: standalone-candidate
          path: dist
      - name: Extract and run real packaged launchers twice, outside checkout
        run: python tools/ci/smoke_standalone.py dist/neuralcloud-standalone.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/NeuralCloud smoke 中文/NeuralCloud/logs/*
  package:
    needs: [python, windows-launcher, smoke]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-candidate
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: neuralcloud-standalone-online
          path: dist/*
          retention-days: 30
